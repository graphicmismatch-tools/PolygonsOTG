plugins {
    id 'com.android.application'
}

android {
    namespace 'app.polygons.otg'
    compileSdk 36

    defaultConfig {
        applicationId 'app.polygons.otg'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs out of the box;
            // replace with your own signingConfig for store releases.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
